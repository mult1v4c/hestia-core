server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    error_log /dev/stdout info;
    access_log /dev/stdout;

    # Docker DNS: resolve at request time and refresh after container IP changes.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;

    location / {
        try_files $uri $uri/ =404;
    }

    location /pi-api/ {
        set $pihole_upstream https://pihole;
        rewrite ^/pi-api/(.*) /$1 break;
        proxy_pass $pihole_upstream;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host pi.hole;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /deluge-api/ {
        set $deluge_upstream http://deluge:8112;
        rewrite ^/deluge-api/(.*) /$1 break;
        proxy_pass $deluge_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Cookie Handling (Critical)
        proxy_cookie_path / /deluge-api/;
    }

    location /jellyfin-api/ {
        set $jellyfin_upstream http://jellyfin:8096;
        rewrite ^/jellyfin-api/(.*) /$1 break;
        proxy_pass $jellyfin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /rss-api/ {
        set $rss_upstream http://freshrss:80;
        rewrite ^/rss-api/(.*) /$1 break;
        proxy_pass $rss_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /glances-api/ {
        set $glances_upstream http://glances:61208;
        rewrite ^/glances-api/(.*) /$1 break;
        proxy_pass $glances_upstream;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
